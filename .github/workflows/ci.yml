name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: Governance Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate pull request metadata and scope
        env:
          BASE_REF: ${{ github.base_ref }}
          LARGE_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'large-change-approved') }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title_pattern='^(feat|fix|docs|chore|refactor|test|perf|ci|build|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! grep -Eq "$title_pattern" <<< "$PR_TITLE"; then
            echo "PR title must use Conventional Commits format." >&2
            exit 1
          fi

          git fetch --no-tags origin "$BASE_REF"
          changed_files=$(git diff --name-only "origin/$BASE_REF...HEAD" | wc -l | tr -d ' ')
          changed_lines=$(git diff --numstat "origin/$BASE_REF...HEAD" | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { total += $1 + $2 } END { print total + 0 }')

          echo "Changed files: $changed_files"
          echo "Changed text lines: $changed_lines"

          if { [ "$changed_files" -gt 75 ] || [ "$changed_lines" -gt 8000 ]; } && [ "$LARGE_CHANGE_APPROVED" != "true" ]; then
            echo "Large PRs require the large-change-approved label and maintainer justification." >&2
            exit 1
          fi

  client-checks:
    name: Client Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: bun run test:e2e

  visual-e2e:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium

      - name: Run visual tests
        run: bun run test:visual
